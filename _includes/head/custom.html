{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="var(--global-bg-color)"/>



<!-- Clean modern look: Inter font + blue accent -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html { scroll-behavior: smooth; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6,
  .page__title, .author__name, .archive__item-title {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .page__title { font-weight: 800; letter-spacing: -0.02em; }

  /* Links */
  a { color: #2563eb; text-underline-offset: 3px; }
  a:hover { color: #1d4ed8; }

  /* Section headings get a soft blue divider */
  .page__content h2 {
    margin-top: 1.8em;
    padding-bottom: 0.3em;
    border-bottom: 2px solid rgba(37, 99, 235, 0.25);
  }

  .page__content li { margin-bottom: 0.4em; }

  /* Top navigation: blue active/hover bar */
  .greedy-nav .visible-links a:before { background: #2563eb; }

  /* Sidebar photo */
  .author__avatar img {
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.35), 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  .author__name { font-weight: 800; }

  /* Buttons (CV download etc.) */
  .btn, .btn--primary {
    border-radius: 8px;
    font-weight: 600;
    transition: background-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .btn--primary {
    background-color: #2563eb;
    color: #fff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
  }
  .btn--primary:hover {
    background-color: #1d4ed8;
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
  }

  /* Featured publication box and other notices */
  .notice--info {
    border-left: 4px solid #2563eb;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
  }

  ::selection { background: rgba(37, 99, 235, 0.25); }
</style>
<!-- end custom head snippets -->
