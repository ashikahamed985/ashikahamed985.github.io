<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- card background (keeps it readable in light and dark mode) -->
  <rect x="1" y="1" width="998" height="468" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- column headers -->
  <g font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.2">
    <text x="30" y="40">1 · DATA</text>
    <text x="275" y="40">2 · MODELS</text>
    <text x="520" y="40">3 · EXPLAIN</text>
    <text x="765" y="40">4 · ACT</text>
  </g>

  <!-- ===== Column 1: data ===== -->
  <rect x="25" y="56" width="215" height="165" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="40" y="84" font-size="15.5" font-weight="700" fill="#0d47a1">Weather stations</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="40" y="110">35 BMD stations, daily,</text>
    <text x="40" y="128">1981–2024</text>
    <text x="40" y="152">Max/min temperature,</text>
    <text x="40" y="170">humidity, cloud, rainfall,</text>
    <text x="40" y="188">wind, sunshine</text>
  </g>

  <rect x="25" y="241" width="215" height="165" rx="12" fill="#e0f2f1" stroke="#00695c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="40" y="269" font-size="15.5" font-weight="700" fill="#004d40">Satellite &amp; terrain</text>
  <text x="40" y="287" font-size="11.5" font-style="italic" fill="#00695c">planned</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="40" y="312">MODIS land surface temp.,</text>
    <text x="40" y="330">NDVI/EVI, aerosol depth,</text>
    <text x="40" y="348">Landsat built-up indices,</text>
    <text x="40" y="366">elevation, ERA5-Land</text>
  </g>

  <!-- ===== Column 2: models ===== -->
  <rect x="270" y="56" width="215" height="165" rx="12" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="285" y="84" font-size="15.5" font-weight="700" fill="#bf360c">Next-day forecasting</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="285" y="110">Strict leakage-free setup</text>
    <text x="285" y="134">22 models: tree ensembles,</text>
    <text x="285" y="152">LSTM/GRU, ARIMA, Prophet</text>
    <text x="285" y="176">Tested against persistence</text>
    <text x="285" y="194">and climatology baselines</text>
  </g>

  <rect x="270" y="241" width="215" height="165" rx="12" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
  <text x="285" y="269" font-size="15.5" font-weight="700" fill="#004d40">Spatial validation</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="285" y="295">Leave-one-station-out</text>
    <text x="285" y="313">test on 32 stations</text>
    <text x="285" y="337">Does the model work at</text>
    <text x="285" y="355">places it was never</text>
    <text x="285" y="373">trained on?</text>
  </g>

  <!-- ===== Column 3: explain ===== -->
  <rect x="515" y="56" width="215" height="350" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="530" y="84" font-size="15.5" font-weight="700" fill="#4a148c">Explainable AI</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="530" y="112">SHAP · LIME</text>
    <text x="530" y="130">Morris sensitivity</text>
    <text x="530" y="148">Permutation importance</text>
  </g>
  <line x1="530" y1="168" x2="715" y2="168" stroke="#ce93d8" stroke-width="1.5"/>
  <g font-size="13" fill="#4a148c" font-style="italic">
    <text x="530" y="196">Which physical drivers</text>
    <text x="530" y="215">push a day into high</text>
    <text x="530" y="234">heat risk, and do they</text>
    <text x="530" y="253">differ from city to city?</text>
  </g>
  <g font-size="12.5" fill="#1e293b">
    <text x="530" y="290">Goal: predictions that</text>
    <text x="530" y="308">forecasters and public-</text>
    <text x="530" y="326">health officials can check</text>
    <text x="530" y="344">and trust</text>
  </g>

  <!-- ===== Column 4: act ===== -->
  <rect x="760" y="56" width="215" height="205" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="775" y="84" font-size="15.5" font-weight="700" fill="#1b5e20">Next-day heat risk</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="775" y="108">Heat Index–based levels</text>
    <text x="775" y="126">for 8 cities in Bangladesh</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="775" y="142" width="90" height="30" rx="15" fill="#c8e6c9" stroke="#2e7d32"/>
    <text x="820" y="161.5" fill="#1b5e20">Safe</text>
    <rect x="871" y="142" width="90" height="30" rx="15" fill="#fff59d" stroke="#f9a825"/>
    <text x="916" y="161.5" fill="#6d4c00">Caution</text>
    <rect x="775" y="180" width="90" height="30" rx="15" fill="#ffcc80" stroke="#ef6c00"/>
    <text x="820" y="199.5" fill="#7a2e00">Danger</text>
    <rect x="871" y="180" width="90" height="30" rx="15" fill="#ef9a9a" stroke="#c62828"/>
    <text x="916" y="193" font-size="10.5" fill="#7f0000">Extreme</text>
    <text x="916" y="205" font-size="10.5" fill="#7f0000">Danger</text>
  </g>
  <text x="775" y="240" font-size="11.5" font-style="italic" fill="#2e7d32">current project</text>

  <rect x="760" y="281" width="215" height="125" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="775" y="309" font-size="15.5" font-weight="700" fill="#1b5e20">Early warning</text>
  <text x="775" y="327" font-size="11.5" font-style="italic" fill="#2e7d32">goal</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="775" y="352">1 km heat-risk maps,</text>
    <text x="775" y="370">including places with</text>
    <text x="775" y="388">no weather station</text>
  </g>

  <!-- ===== arrows ===== -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="242" y1="138" x2="267" y2="138"/>
    <line x1="242" y1="323" x2="267" y2="323" stroke-dasharray="5 4"/>
    <line x1="487" y1="138" x2="512" y2="138"/>
    <line x1="487" y1="323" x2="512" y2="323"/>
    <line x1="732" y1="158" x2="757" y2="158"/>
    <line x1="732" y1="343" x2="757" y2="343" stroke-dasharray="5 4"/>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#64748b">
    <line x1="30" y1="440" x2="62" y2="440" stroke="#64748b" stroke-width="2"/>
    <text x="70" y="444">current work</text>
    <line x1="170" y1="440" x2="202" y2="440" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="210" y="444">planned / next step</text>
  </g>
</svg>
